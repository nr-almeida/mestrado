name: CI - mestrado (ProMoBD/FTGO)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & testes (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [servico-order, servico-accounting]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npx tsc --noEmit -p tsconfig.json

      - name: Rodar testes (unitários + integração)
        run: npm test -- --ci --coverage

      - name: Build de produção
        run: npm run build

  integration-demo:
    name: Integração entre ServicoOrder e ServicoAccounting
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências (ambos os serviços)
        run: |
          cd services/servico-order && npm ci && cd ../servico-accounting && npm ci

      - name: Rodar o fluxo completo Order -> Accounting -> Order (script de demonstração)
        run: bash scripts/demo-order-accounting-flow.sh
